<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e1005" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1e1005" flood-opacity="0.25"/>
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8bc"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="pinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-3 32 32)">
    <!-- Sticky Note Paper with Shadow -->
    <rect x="7" y="7" width="50" height="50" rx="3" fill="url(#paperGrad)" filter="url(#shadow)"/>
    
    <!-- Paper curl corner at bottom right -->
    <path d="M51 57 L57 51 L51 51 Z" fill="#eab308" opacity="0.6"/>

    <!-- Subtle Handwritten Note Lines -->
    <line x1="16" y1="25" x2="48" y2="25" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.38"/>
    <line x1="16" y1="34" x2="42" y2="34" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.38"/>
    <line x1="16" y1="43" x2="33" y2="43" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.38"/>

    <!-- Pushpin on top -->
    <circle cx="32" cy="13" r="6" fill="url(#pinGrad)" filter="url(#pinShadow)"/>
    <ellipse cx="30" cy="11" rx="2" ry="1.2" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
